name: shareit
description: Peer-to-peer item & service exchange app
publish_to: 'none'
version: 1.0.9+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1
  cloud_functions: ^5.1.3
  flutter_local_notifications: ^17.2.3
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  easy_localization: ^3.0.7
  google_sign_in: ^6.2.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  shimmer: ^3.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  package_info_plus: ^10.1.0
  firebase_crashlytics: ^4.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/translations/

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/shareit_icon_1024.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/shareit_icon_1024.png"
